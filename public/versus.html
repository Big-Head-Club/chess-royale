<!doctype html>
<html lang="en">
<head>
<script>window.tally=window.tally||function(){window.tally.q.push(arguments)};window.tally.q=window.tally.q||[];</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style id="phone-rules">
/* PHONE RULES (mobile pass 2026-10-18). A game, not a document. First in the head so the game's own CSS wins.
   touch-action: manipulation = no double-tap zoom (every plain button had it); a board or canvas that handles
   its own gestures sets touch-action: none itself. 16px floor on inputs: iOS zooms the page into anything smaller
   and leaves it zoomed. No long-press selection or copy sheet on the game; inputs stay selectable. */
* { touch-action: manipulation; }
html { -webkit-text-size-adjust: 100%; }
body { -webkit-tap-highlight-color: transparent; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
input, textarea, [contenteditable] { -webkit-user-select: text; user-select: text; }
input, select, textarea { font-size: max(16px, 1em); }
</style>
<script>/* iOS ignores user-scalable=no; this is what stops a pinch from zooming the page */
addEventListener("gesturestart", (e) => e.preventDefault(), { passive: false });</script>
<title>Chess Royale — Play a friend</title>
<link rel="stylesheet" href="/public/app.css">
<script defer src="https://gameaday.xyz/gameaday.js"></script>
</head>
<body>
<main class="stage">
  <div class="topline">
    <a class="back" href="/" aria-label="Back to the menu">←</a>
    <h1>Play a friend</h1>
  </div>

  <div class="chips" id="chips" hidden>
    <span class="chip">Round <b id="c-round">1</b>/11</span>
    <span class="chip" id="c-ring">Ring falls</span>
    <span class="chip">Moves <b class="pips" id="c-pips">●●●</b></span>
  </div>

  <div class="lobby" id="lobby">
    <p class="lede">One of you makes a room and sends the link. The other opens
       it. That is the whole setup.</p>
    <button class="btn primary" id="make">Make a room</button>
    <div class="joinrow">
      <input id="code" placeholder="Room code" maxlength="4" autocomplete="off"
             autocapitalize="characters" spellcheck="false">
      <button class="btn ghost narrow" id="join">Join</button>
    </div>
    <p class="say" id="lobby-say"></p>
  </div>

  <div class="board" id="board" hidden></div>

  <p class="say" id="say"></p>

  <div class="tray" id="tray" hidden>
    <div><span>Yours</span><span class="won you" id="t-you"></span></div>
    <div><span>Theirs</span><span class="won foe" id="t-foe"></span></div>
  </div>

  <div class="acts" id="acts" hidden>
    <button class="btn ghost" id="end">Skip turn</button>
    <button class="btn ghost narrow" id="undo">Undo</button>
  </div>

  <div class="over" id="over" hidden>
    <h2 id="over-h"></h2>
    <p id="over-p"></p>
    <button class="btn primary" id="again">Play again</button>
  </div>
</main>
<script type="module" src="/src/game/versus.view.mjs"></script>
<script defer src="/t.js"></script>
<script defer src="https://hundred-carts-production.up.railway.app/credits.js" data-credits-game="chess-royale"></script>
<script defer src="https://bhc-arcade.fly.dev/t.js"></script>
</body>
</html>
